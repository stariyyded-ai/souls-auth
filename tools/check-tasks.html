<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><base href="../"><title>Проверка автотестов заданий</title></head>
<body>
<!-- Прогоняет каждое задание дважды: шаблон должен провалить проверки результата, эталон — пройти все.
     Запуск: node tools/check-tasks.mjs (нужен локальный сервер, см. README).
     tools/check-tasks.html?only=k01,k02 — только задания курса из content/tasks/k01.js и k02.js
     с решениями из tools/solutions/k01.js и k02.js (сборка не нужна). -->
<pre id="out">Проверяю…</pre>
<script src="vendor/htmlhint/htmlhint.min.js"></script>
<script src="js/task-runner.js"></script>
<script src="js/tasks-data.js"></script>
<script src="tools/solutions.js"></script>
<script>
(async () => {
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src + '?r=' + Date.now(); s.onload = res; s.onerror = () => rej(new Error('не загрузился ' + src)); document.head.appendChild(s); });
  const only = (new URLSearchParams(location.search).get('only') || '').split(',').map(s => s.trim()).filter(Boolean);
  const rows = [];
  try {
    let list = window.TASKS;
    if (only.length) {
      await load('content/tasks/_kit.js');
      for (const f of only) { await load(`content/tasks/${f}.js`); await load(`tools/solutions/${f}.js`); }
      list = window.COURSE_TASKS;
    } else {
      await load('js/tasks-course.js'); await load('tools/solutions-course.js');
      list = window.TASKS;
    }
    for (const t of list) {
      const start = await TaskRunner.run(t, t.html, t.css, t.js || '');
      const fn = window.TASK_SOLUTIONS[t.id];
      if (!fn) { rows.push({ id: t.id, title: t.title, starterFails: start.func.filter(x => !x.ok).length, solutionFuncFails: ['нет эталонного решения'], solutionQualityFails: [], lintErrors: [] }); continue; }
      const sol = fn(t);
      const done = await TaskRunner.run(t, sol.html, sol.css, sol.js || '');
      rows.push({
        id: t.id, title: t.title,
        starterFails: start.func.filter(x => !x.ok).length,
        solutionFuncFails: done.func.filter(x => !x.ok).map(x => x.name + (x.note ? ' — ' + x.note : '')),
        solutionQualityFails: done.quality.filter(x => !x.ok).map(x => x.name + (x.note ? ' — ' + x.note : '')),
        lintErrors: done.lint.filter(m => m.type === 'error').map(m => m.lang + ':' + m.line + ' ' + m.message)
      });
    }
  } catch (e) { window.FATAL = e.message; }
  window.RESULT = rows;
  document.getElementById('out').textContent = JSON.stringify(rows, null, 2);
})();
</script>
</body>
</html>
