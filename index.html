<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход · Пепельный Пиксель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Pixelify+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="stage">
    <header class="top">
      <span id="logoFlame"></span>
      <span class="logo-name">ПЕПЕЛЬНЫЙ ПИКСЕЛЬ</span>
    </header>

    <main class="center">
      <section class="panel out" id="panel" aria-labelledby="t-login">
        <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-br"></span><span class="corner c-bl"></span>
        <div class="view">
          <div class="runes"></div>
          <h1 id="t-login">ВХОД</h1>
          <p class="sub">Негорящий, назови себя</p>
          <div class="divider"><i></i><span class="dia"></span><i></i></div>
          <form id="f-login" novalidate>
            <div class="field">
              <label for="l-name">Имя или e-mail</label>
              <div class="input"><span class="dia ember"></span><input id="l-name" name="login" autocomplete="username" placeholder="Солер из Асторы"></div>
            </div>
            <div class="field">
              <label for="l-pass">Пароль</label>
              <div class="input"><span class="dia ember"></span><input id="l-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
            </div>
            <div class="opts">
              <label class="check"><input id="l-remember" name="remember" type="checkbox" checked> Запомнить у костра</label>
              <button type="button" class="link" id="forgot">Забыл пароль?</button>
            </div>
            <button class="btn" id="b-login" type="submit"><span class="flame"></span>ВОЙТИ<span class="flame"></span></button>
            <p class="note" id="n-login" role="status"></p>
          </form>
          <p class="alt">Нет персонажа? <a href="register.html" data-fade>Зарегистрироваться</a></p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span class="msg">впереди костёр</span>
      <span>v0.1 · Эпоха огня</span>
    </footer>
  </div>

  <div class="banner lit" id="bn-lit"><span>КОСТЁР ЗАЖЖЁН</span></div>
  <div class="banner dead" id="bn-dead"><span>ВЫ ПОГИБЛИ</span></div>

  <script src="js/common.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/shatter.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
